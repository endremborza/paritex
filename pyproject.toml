[project]
name = "paritex"
description = "Check PDF <-> LaTeX parity for paper reconstruction"
dynamic = ["version"]
authors = [{name = "Endre Márk Borza", email = "endremborza@gmail.com"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
]

[project.scripts]
paritex = "paritex.cli:main"

[project.urls]
Homepage = "https://github.com/endremborza/paritex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "paritex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["paritex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"paritex/prompts.py" = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
